[package]
name = "ttng-core"
description = "TeamTalk NG's core: a safe client for BearWare's TeamTalk 5 SDK"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ttng-sys = { path = "../ttng-sys" }
# .tt files and BearWare's server list (XML); BearWare's web services.
roxmltree = "0.20"
ureq = "3"
# MP3 recordings: BearWare's SDK only encodes MP3 on Windows (Media
# Foundation), so it records WAV and LAME (LGPL) makes the MP3.
mp3lame-encoder = "0.3"


[lints]
workspace = true

[dev-dependencies]
# The UI tests' host (examples/uitest_host.rs) answers in JSON.
serde_json = "1"
# Decodes the MP3 recordings in tests (pure Rust).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
