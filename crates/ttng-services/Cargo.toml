[package]
name = "ttng-services"
description = "TeamTalk NG's own services: NG Account (sign-in, sync) and, later, the Monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
# The Monitor's test watches a real TeamTalk server, with the core as the
# other person.
ttng-core = { path = "../ttng-core" }
