[package]
name = "ttng-services"
description = "TeamTalk NG's own services: NG Account (sign-in, sync) and, later, the Monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
# Your own Monitor: pairing and sessions through the relay.
ng-relay = { path = "../ng-relay" }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[lints]
workspace = true

[dev-dependencies]
# The Monitor's test watches a real TeamTalk server, with the core as the
# other person.
ttng-core = { path = "../ttng-core" }
