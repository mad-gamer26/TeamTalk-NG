# XcodeGen spec for TeamTalk NG on iPhone (SwiftUI on the Rust core). Build:
#   apps/ios/build-core.sh && cd apps/ios && xcodegen generate
# TTNG_BUNDLE_ID: the real app's ID (com.matthewdovi.TeamTalk-NG) makes a
# build replace the installed TeamTalk NG; the default is a separate
# development app that installs beside it.
name: TeamTalkNG
options:
  bundleIdPrefix: com.matthewdovi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5NJK4F832Z
    TTNG_BUNDLE_ID: com.matthewdovi.TeamTalk-NG.dev
    TTNG_DISPLAY_NAME: TTNG Dev
    # The Monitor and NG Account service. TEMPORARY for the dev app: the
    # development ngmon on the owner's Mac (Tailscale only, its own empty
    # database; ~/ngmon-dev there). Empty means the live service. The
    # real app must use the live service (and lose the HTTP exception).
    TTNG_SERVICE_URL: "http://100.118.202.104:8650"
    TTNG_APP_GROUP: "group.$(TTNG_BUNDLE_ID)"
targets:
  TeamTalkNG:
    type: application
    platform: iOS
    sources:
      - TeamTalkNG
      - Shared
      - path: Notifications/MonitorSound.swift
      - path: Generated/ttng_ffi.swift
    info:
      path: TeamTalkNG/Info.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        TTNGServiceURL: "$(TTNG_SERVICE_URL)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        # DEV ONLY: the development Monitor is plain HTTP on a Tailscale
        # address. Remove with TTNG_SERVICE_URL for the real app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Stays connected, and keeps talking and listening, when locked.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "TeamTalk NG sends your voice to the channel you're in when you talk."
        NSLocalNetworkUsageDescription: "TeamTalk NG connects to TeamTalk servers on your network."
        ITSAppUsesNonExemptEncryption: false
        # Downloads go to the app's documents, shown in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # tt:// links and .tt files open in the app, as on the desktop.
        CFBundleURLTypes:
          - CFBundleURLName: TeamTalk link
            CFBundleURLSchemes: [tt]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dk.bearware.teamtalk.tt
            UTTypeDescription: TeamTalk server
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tt]
        CFBundleDocumentTypes:
          - CFBundleTypeName: TeamTalk server
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dk.bearware.teamtalk.tt]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # iPhones and the Simulator (the Simulator needs the SDK built from
        # source: scripts/build-sdk-apple.sh; see build-core.sh).
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # The SDK inside the core is C++ and uses zlib (and FFmpeg in the
        # SDK built from source, iconv).
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv"]
        # Shared/ConnectIntent.swift acts only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TTNG_APP"
    entitlements:
      path: Generated/TeamTalkNG.entitlements
      properties:
        # Monitor notifications (development builds: Apple's sandbox).
        aps-environment: development
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
        # Settings sync through iCloud (opt-in).
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    dependencies:
      - target: TeamTalkNGNotifications
        embed: true
      - target: TeamTalkNGControls
        embed: true
      - framework: Generated/TeamTalkCore.xcframework
        embed: false
      # AudioNet (scripts/build-audionet.sh): its engine and Swift module.
      - target: AudioNetKit
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

  # Opens the Monitor's sealed notifications with this install's key (from
  # the shared App Group), so Apple only ever sees a placeholder.
  TeamTalkNGNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
    info:
      path: Generated/NotificationsInfo.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME) Notifications"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    entitlements:
      path: Generated/Notifications.entitlements
      properties:
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).Notifications"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  # AudioNet's Swift interface as a module of its own (its names, such as
  # Event, would meet the core's), over its pre-linked engine.
  AudioNetKit:
    type: framework
    platform: iOS
    sources:
      - path: AudioNet/audionet_ffi.swift
    dependencies:
      - framework: AudioNet/AudioNetCore.xcframework
        embed: false
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).AudioNetKit"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/AudioNet/AudioNetCore.xcframework/ios-arm64/Headers/audionet_ffiFFI"
        # Generated code: its warnings aren't ours.
        SWIFT_SUPPRESS_WARNINGS: YES

  # The Control Center control (iOS 18): "Connect to Server".
  TeamTalkNGControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Controls
      - Shared
    info:
      path: Generated/ControlsInfo.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME) Controls"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Controls.entitlements
      properties:
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).Controls"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
