# XcodeGen spec for TeamTalk NG on iPhone (SwiftUI on the Rust core). Build:
#   apps/ios/build-core.sh && cd apps/ios && xcodegen generate
# TTNG_BUNDLE_ID: the real app's ID (com.matthewdovi.TeamTalk-NG) makes a
# build replace the installed TeamTalk NG; the default is a separate
# development app that installs beside it.
name: TeamTalkNG
options:
  bundleIdPrefix: com.matthewdovi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5NJK4F832Z
    TTNG_BUNDLE_ID: com.matthewdovi.TeamTalk-NG.dev
    TTNG_DISPLAY_NAME: TTNG Dev
targets:
  TeamTalkNG:
    type: application
    platform: iOS
    sources:
      - TeamTalkNG
      - path: Generated/ttng_ffi.swift
    info:
      path: TeamTalkNG/Info.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Stays connected, and keeps talking and listening, when locked.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "TeamTalk NG sends your voice to the channel you're in when you talk."
        NSLocalNetworkUsageDescription: "TeamTalk NG connects to TeamTalk servers on your network."
        ITSAppUsesNonExemptEncryption: false
        # Downloads go to the app's documents, shown in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # tt:// links and .tt files open in the app, as on the desktop.
        CFBundleURLTypes:
          - CFBundleURLName: TeamTalk link
            CFBundleURLSchemes: [tt]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dk.bearware.teamtalk.tt
            UTTypeDescription: TeamTalk server
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tt]
        CFBundleDocumentTypes:
          - CFBundleTypeName: TeamTalk server
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dk.bearware.teamtalk.tt]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # iPhones and the Simulator (the Simulator needs the SDK built from
        # source: scripts/build-sdk-apple.sh; see build-core.sh).
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # The SDK inside the core is C++ and uses zlib (and FFmpeg in the
        # SDK built from source, iconv).
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv"]
    dependencies:
      - framework: Generated/TeamTalkCore.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
