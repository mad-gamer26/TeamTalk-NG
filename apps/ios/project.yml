# XcodeGen spec for TeamTalk NG on iPhone (SwiftUI on the Rust core). Build:
#   apps/ios/build-core.sh && cd apps/ios && xcodegen generate
# TTNG_BUNDLE_ID: the real app's ID (com.matthewdovi.TeamTalk-NG, since
# 2026-11-17): a build replaces the installed TeamTalk NG and imports the
# old app's data. com.matthewdovi.TeamTalk-NG.dev with "TTNG Dev" makes a
# separate development app that installs beside it.
name: TeamTalkNG
options:
  bundleIdPrefix: com.matthewdovi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "37"
    DEVELOPMENT_TEAM: 5NJK4F832Z
    TTNG_BUNDLE_ID: com.matthewdovi.TeamTalk-NG
    TTNG_DISPLAY_NAME: TeamTalk NG
    # TeamTalk NG's service (NG Account for publishing packs, the relay to
    # your own Monitor, its push gateway): empty means the live one
    # (https://ttmonitor.mad-gamer.com). The UI tests set a private one.
    TTNG_SERVICE_URL: ""
    # The sound pack catalog's packs.json: empty means the live one
    # (https://ttng-soundpacks.mad-gamer.com/packs.json).
    TTNG_CATALOG_URL: ""
    TTNG_APP_GROUP: "group.$(TTNG_BUNDLE_ID)"
targets:
  TeamTalkNG:
    type: application
    platform: iOS
    sources:
      - TeamTalkNG
      - Shared
      - path: Notifications/MonitorSound.swift
      - path: Generated/ttng_ffi.swift
    info:
      path: TeamTalkNG/Info.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        TTNGServiceURL: "$(TTNG_SERVICE_URL)"
        TTNGCatalogURL: "$(TTNG_CATALOG_URL)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        # Plain HTTP only on this device and the local network (the UI
        # tests' private services on localhost); everything else HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Stays connected, and keeps talking and listening, when locked.
        # NG Account's silent "changed elsewhere" notices sync in the background.
        UIBackgroundModes: [audio, remote-notification]
        NSMicrophoneUsageDescription: "TeamTalk NG sends your voice to the channel you're in when you talk."
        NSLocalNetworkUsageDescription: "TeamTalk NG connects to TeamTalk servers on your network."
        ITSAppUsesNonExemptEncryption: false
        # Downloads go to the app's documents, shown in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # tt:// links and .tt files open in the app, as on the desktop.
        CFBundleURLTypes:
          - CFBundleURLName: TeamTalk link
            CFBundleURLSchemes: [tt]
          # A Live Activity tapped opens its server.
          - CFBundleURLName: TeamTalk NG
            CFBundleURLSchemes: [teamtalkng]
        # A Live Activity for each connected server (Settings → Live Activities).
        NSSupportsLiveActivities: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dk.bearware.teamtalk.tt
            UTTypeDescription: TeamTalk server
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tt]
          # A TeamTalk NG backup (Settings → Backup and Restore).
          - UTTypeIdentifier: com.matthewdovi.teamtalk-ng.backup
            UTTypeDescription: TeamTalk NG backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ttng]
        CFBundleDocumentTypes:
          - CFBundleTypeName: TeamTalk server
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dk.bearware.teamtalk.tt]
          - CFBundleTypeName: TeamTalk NG backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.matthewdovi.teamtalk-ng.backup]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # iPhones and the Simulator (the Simulator needs the SDK built from
        # source: scripts/build-sdk-apple.sh; see build-core.sh).
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # The SDK inside the core is C++ and uses zlib (and FFmpeg in the
        # SDK built from source, iconv).
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv"]
        # Shared/ConnectIntent.swift acts only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TTNG_APP"
        # The app's icon (TeamTalkNG/Assets.xcassets).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Generated/TeamTalkNG.entitlements
      properties:
        # Monitor notifications (development builds: Apple's sandbox).
        aps-environment: development
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
        # iCloud sync: settings and servers (key-value store), your own
        # sound packs (iCloud Drive, the app's own container).
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: ["iCloud.$(CFBundleIdentifier)"]
        com.apple.developer.ubiquity-container-identifiers: ["iCloud.$(CFBundleIdentifier)"]
    dependencies:
      - target: TeamTalkNGNotifications
        embed: true
      - target: TeamTalkNGControls
        embed: true
      - framework: Generated/TeamTalkCore.xcframework
        embed: false
      # AudioNet (scripts/build-audionet.sh): its engine and Swift module.
      - target: AudioNetKit
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

  # Opens the Monitor's sealed notifications with this install's key (from
  # the shared App Group), so Apple only ever sees a placeholder.
  TeamTalkNGNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
    info:
      path: Generated/NotificationsInfo.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME) Notifications"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    entitlements:
      path: Generated/Notifications.entitlements
      properties:
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).Notifications"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  # NG Account through the app (scripts/test-ng-account-ui.sh): Simulator only.
  TeamTalkNGUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TeamTalkNG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).UITests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TeamTalkNG
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  # AudioNet's Swift interface as a module of its own (its names, such as
  # Event, would meet the core's), over its pre-linked engine.
  AudioNetKit:
    type: framework
    platform: iOS
    sources:
      - path: AudioNet/audionet_ffi.swift
    dependencies:
      - framework: AudioNet/AudioNetCore.xcframework
        embed: false
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).AudioNetKit"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/AudioNet/AudioNetCore.xcframework/ios-arm64/Headers/audionet_ffiFFI"
        # Generated code: its warnings aren't ours.
        SWIFT_SUPPRESS_WARNINGS: YES

  # Live Activities (iOS 17) and Control Center's controls (iOS 18).
  TeamTalkNGControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Controls
      - Shared
    info:
      path: Generated/ControlsInfo.plist
      properties:
        CFBundleDisplayName: "$(TTNG_DISPLAY_NAME) Controls"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TTNGAppGroup: "$(TTNG_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Controls.entitlements
      properties:
        com.apple.security.application-groups: ["$(TTNG_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TTNG_BUNDLE_ID).Controls"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

schemes:
  TeamTalkNG:
    build:
      targets:
        TeamTalkNG: all
    test:
      targets:
        - TeamTalkNGUITests
