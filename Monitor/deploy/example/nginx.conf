# monitor.example.com: TeamTalk NG Monitor (ngmon on 127.0.0.1:8650). The
# two snippets are your own TLS certificate and proxy settings.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.example.com;
    include /etc/nginx/snippets/ssl-wildcard.conf;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8650;
        include /etc/nginx/snippets/proxy-common.conf;
        # The app's live view is a WebSocket; the monitor pings it every
        # 25 seconds, inside proxy-common's 90-second timeouts.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Sound pack uploads (a pack is at most 25 MB) and NG Account sync.
    location ~ ^/v1/packs/[^/]+/files/ {
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8650;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /v1/sync {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8650;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
